name: PKCE bean starter check

on:
  push:
    branches:
      - pkce-bean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .java-version
          cache: gradle
      - name: Verify starter and build unchanged application JAR
        run: ./gradlew :pkce-starter:check :pkce-starter:jar :api:bootJar
      - name: Verify external JAR loading and OAuth2 login with mock IdP
        run: python3 pkce-starter/verification/runtime_login.py
