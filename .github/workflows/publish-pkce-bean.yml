name: Publish PKCE bean image (manual)

on:
  push:
    branches: [pkce-bean]
    paths:
      - '.github/workflows/publish-pkce-bean.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Base Kafbat version for the image tag (e.g. 1.5.0)"
        required: true
        default: "1.5.0"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: pkce-bean-image-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .java-version
          cache: gradle
      - name: Validate image version
        id: version
        env:
          IMAGE_VERSION: ${{ inputs.version || '1.5.0' }}
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: $IMAGE_VERSION" >&2
            exit 1
          fi
          echo "tag=${IMAGE_VERSION}-pkce-bean" >> "$GITHUB_OUTPUT"
      - name: Verify external starter and unchanged application JAR
        run: |
          ./gradlew -Pinclude-frontend=true :pkce-starter:check :pkce-starter:jar :api:bootJar
          jar_file=$(find api/build/libs -maxdepth 1 -name 'api-*.jar' ! -name '*plain*' -print -quit)
          test -n "$jar_file"
          unzip -Z1 "$jar_file" | grep -Fxq 'BOOT-INF/classes/static/index.html' || {
            echo "Missing frontend static/index.html in $jar_file" >&2
            exit 1
          }
          python3 pkce-starter/verification/runtime_login.py
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned PKCE bean image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build -f pkce-starter/Dockerfile -t "ghcr.io/diemar-consulting/kafka-ui:$TAG" .
          docker push "ghcr.io/diemar-consulting/kafka-ui:$TAG"
